# Production stack for iibaza VPS (network iibaza_edge + Caddy path /invix).
# Photos: MinIO S3. Public reads go through the API media proxy.
services:
  postgres:
    image: postgres:16-alpine
    container_name: invix-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shop_db
    volumes:
      - invix_shop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 256M

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: invix-shop-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - invix_shop_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 256M

  temporal-postgres:
    image: postgres:16-alpine
    container_name: invix-shop-temporal-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - invix_shop_temporal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 256M

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: invix-shop-temporal
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  api:
    build: ./backend
    image: invix-shop-api
    container_name: invix-shop-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:${POSTGRES_PASSWORD}@postgres:5432/shop_db
      STORAGE_BACKEND: s3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: products
      MINIO_SECURE: "false"
      TEMPORAL_HOST: temporal:7233
      BACKEND_URL: ${BACKEND_URL}
      WEBAPP_URL: ${WEBAPP_URL}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - internal
      - edge
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # Any number of replicas poll shop-bot-queue and can run any activity.
  # Scale: docker compose -f docker-compose.prod.yml up -d --scale worker=2
  # container_name is omitted: Compose requires a unique name per replica.
  worker:
    build: ./backend
    image: invix-shop-api
    restart: unless-stopped
    command: python -m app.temporal.worker
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:${POSTGRES_PASSWORD}@postgres:5432/shop_db
      STORAGE_BACKEND: s3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: products
      MINIO_SECURE: "false"
      TEMPORAL_HOST: temporal:7233
      BACKEND_URL: ${BACKEND_URL}
      WEBAPP_URL: ${WEBAPP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  bot:
    build: ./backend
    image: invix-shop-api
    container_name: invix-shop-bot
    restart: unless-stopped
    command: python -m bot.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:${POSTGRES_PASSWORD}@postgres:5432/shop_db
      STORAGE_BACKEND: s3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: products
      MINIO_SECURE: "false"
      TEMPORAL_HOST: temporal:7233
      BACKEND_URL: ${BACKEND_URL}
      WEBAPP_URL: ${WEBAPP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started
      worker:
        condition: service_started
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://iibaza.ru/invix}
        NEXT_BASE_PATH: /invix
    image: invix-shop-web
    container_name: invix-shop-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M

volumes:
  invix_shop_pg:
  invix_shop_minio:
  invix_shop_temporal_pg:

networks:
  internal:
    driver: bridge
  edge:
    external: true
    name: iibaza_edge
